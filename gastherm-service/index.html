<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Gastherm Service</title>
  <meta name="description" content="Πελάτες, εγκαταστάσεις και προγραμματισμός συντηρήσεων">
  <meta name="theme-color" content="#1D55D6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gastherm">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="css/app.css?v=1">
</head>
<body>
  <div id="screen-loading" class="screen"><div class="spinner" role="status" aria-label="Φόρτωση"></div></div>
  <div id="screen-msg" class="screen" hidden></div>
  <div id="screen-app" class="app" hidden>
    <aside class="rail" id="rail"></aside>
    <header class="topbar" id="topbar"></header>
    <main id="view" class="view"></main>
    <nav class="tabbar" id="tabbar" aria-label="Κύρια πλοήγηση"></nav>
    <div id="sheet-backdrop" class="sheet-backdrop" data-act="close-sheet" hidden></div>
    <aside id="sheet" class="sheet" hidden aria-live="polite"></aside>
  </div>
  <dialog id="dlg"></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="js/config.js?v=1"></script>
  <script type="module" src="js/app.js?v=1"></script>
</body>
</html>
